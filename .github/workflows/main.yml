name: UI tests

on:
  push:
    branches: [master]

  pull_request:
    branches: [master]

  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment"
        required: true
        default: qa
        type: choice
        options:
          - qa
          - uat

      suite:
        description: "Select test suite"
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - regression

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '27'
          cache: maven

      - name: Install Playwright Chromium
        run: mvn -B exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"

      - name: Run tests
        env:
          ENV: ${{ inputs.environment || 'qa' }}
          HEADLESS: "true"
          TEST_SUITE: ${{ inputs.suite || 'regression' }}
        run: >
          mvn -B clean test
          "-Dgroups=$TEST_SUITE"
          -Dsurefire.rerunFailingTestsCount=2

      - name: Save Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Save screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-evidence
          path: target/test-artifacts
          if-no-files-found: ignore
          retention-days: 7

      - name: Save videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-videos
          path: target/videos
          if-no-files-found: ignore
          retention-days: 7